declare -g ARCH="riscv64"
declare -g LINUXFAMILY="ky"
declare -g GOVERNOR="performance"

# U-Boot
#declare -g BOOTSOURCE="https://github.com/orangepi-xunlong/u-boot-orangepi.git"
#declare -g BOOTBRANCH="branch:v2022.10-ky"
declare -g BOOTBRANCH='tag:v2022.10'
declare -g BOOTPATCHDIR="${BOOTPATCHDIR:-"u-boot-ky"}"
declare -g BOOTDIR='u-boot-ky'
declare -g UBOOT_TARGET_MAP=";;bootinfo_emmc.bin bootinfo_sd.bin bootinfo_spinand.bin bootinfo_spinor.bin FSBL.bin u-boot-env-default.bin u-boot-opensbi.itb"
declare -g BOOTCONFIG="x1_defconfig" # Boot with generic Ky X1 config

# Linux
case "${BRANCH}" in
	current)
		declare -g KERNELSOURCE="https://github.com/jmontleon/linux-bianbu.git"
		declare -g KERNELBRANCH="branch:linux-6.6.y"
		declare -g EXTRAWIFI="no" # WiFi drivers are already included in the kernel
		declare -g KERNEL_MAJOR_MINOR="6.6"
		declare -g LINUXCONFIG="linux-${LINUXFAMILY}-current"
		;;
	edge)
		declare -g KERNELSOURCE="https://github.com/jmontleon/linux-bianbu.git"
		declare -g KERNELBRANCH="branch:linux-6.17.y"
		declare -g EXTRAWIFI="no" # WiFi drivers are already included in the kernel
		declare -g KERNEL_MAJOR_MINOR="6.17"
		declare -g LINUXCONFIG="linux-${LINUXFAMILY}-edge"
		;;
esac

function custom_kernel_config__ky_x1_firmware() {
	if [[ -f .config ]]; then
		# check $kernel_work_dir is set and exists, or bail
		[[ -z "${kernel_work_dir}" ]] && exit_with_error "kernel_work_dir is not set"
		[[ ! -d "${kernel_work_dir}" ]] && exit_with_error "kernel_work_dir does not exist: ${kernel_work_dir}"
		display_alert "$BOARD" "Adding boot firmware" "info"
		mkdir -pv "${kernel_work_dir}/firmware"
		cp -fv "$SRC/packages/blobs/riscv64/spacemit/esos.elf" "${kernel_work_dir}/firmware"
	fi
}

pre_prepare_partitions() {
	declare -g OFFSET="4"
	declare -g IMAGE_PARTITION_TABLE="msdos"
}

# Notes:
# bootinfo_spinor.bin is found in /dev/mtd/by-name/bootinfo
# bootinfo_spinand.bin may be unused, installed for reference
# In difference to Banana Pi F3, OpenSBI is not compiled
# separately, but as part of the uboot tree which in turn
# is then seems integrated within u-boot-opensbi.itb file.

write_uboot_platform() {
	local device=${2}
	if [ -b ${2}boot0 ]; then
		echo "eMMC"
		echo 0 > /sys/block/${2}/force_ro
		sleep .50
		dd if="$1/bootinfo_emmc.bin" of="/dev/${2}" conv=notrunc
	else
		echo "SD card"
		dd if="$1/bootinfo_sd.bin" of="/dev/${2}" conv=notrunc
	fi
	dd if="$1/FSBL.bin" of="${2}" bs=512 seek=256 conv=notrunc
	dd if="$1/u-boot-env-default.bin" of="${2}" bs=512 seek=768 conv=notrunc
	dd if="$1/u-boot-opensbi.itb" of="${2}" bs=512 seek=1664 conv=notrunc
	sync
}
